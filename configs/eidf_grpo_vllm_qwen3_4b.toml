# Fresh sweep: all thirteen default reward runs, one at a time.
# Set --run rouge_l (etc.) to select a subset. Install with bootstrap_vllm_eidf.sh.
output_dir = "/workspace/writeable/non-verifiable-rewards/outputs/grpo_vllm_qwen3_4b"
cache_dir = "/root/.cache/non-verifiable-rewards"

[data]
datasets = ["reddit_tldr", "litbench", "wmt14_de_en", "supergpqa"]
# Disable SuperGPQA training while keeping its held-out evaluation.
train_supergpqa = true

[wandb]
enabled = true
project = "non-verifiable rewards"
entity = ""  # Use the authenticated account's default entity.

[policy]
enable_thinking = true

[judge]
enable_thinking = false
max_thinking_tokens = 1024

[inference]
backend = "vllm"
gpu_memory_utilization = 0.35
reward_gpu_memory_utilization = 0.35
batch_size = 16

[reward_models]
python = "/root/nvr-vllm-venv/bin/python"
bleurt_python = "/root/nvr-bleurt-venv/bin/python"
